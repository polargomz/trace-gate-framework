schema_version: "1.1.0"
gate_id: GATE.STAGE2.PRIMARY

evaluator:
  id: trace-gate.reference-evaluator
  version: "1.1.0"

required:
  success_rate: ">= 99%"
  duplicate_writes: 0
  forbidden_changes: 0
  rollback_rehearsal: pass

decision:
  newly_allowed_authority: []
  still_forbidden: []

approved_by: null

# status, checks, input_digest, receipt_digest와 evaluated_at은 evaluator가
# 증적 입력에서 계산한다. 사람이 pass를 직접 기입하지 않는다.
